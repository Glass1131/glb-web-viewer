<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14171e" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <title>GLB 3D Viewer</title>

  <!-- Three.js ESM Import Map (CDN: jsDelivr) -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --ui-bg: rgba(20, 23, 30, 0.78);
      --ui-border: rgba(255, 255, 255, 0.14);
      --ui-text: #f3f5f8;
      --ui-muted: #9aa4b2;
      --accent: #4f8cff;
      --accent-hover: #6aa0ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      color: var(--ui-text);
      background-color: #14171e;
    }

    /* 뷰어 컨테이너: 반응형 크기 및 모바일 터치 제스처 충돌 방지 */
    .viewer-stage {
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    /* 투명 배경 모드 확인용 체커보드 (실제 웹페이지 배경 위에 올릴 때는 이 배경 규칙을 제거하세요) */
    .viewer-stage.is-transparent {
      background-color: #1d212a;
      background-image:
        linear-gradient(45deg, #262b36 25%, transparent 25%),
        linear-gradient(-45deg, #262b36 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #262b36 75%),
        linear-gradient(-45deg, transparent 75%, #262b36 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    #viewer-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* 드래그 앤 드롭 하이라이트 */
    .drop-overlay {
      position: absolute;
      inset: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--accent);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(8px);
      font-size: 1.05rem;
      font-weight: 600;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.18s ease;
      z-index: 30;
    }

    .viewer-stage.is-dragover .drop-overlay {
      opacity: 1;
    }

    /* 로딩 및 에러 오버레이 */
    .status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: rgba(16, 19, 25, 0.78);
      backdrop-filter: blur(10px);
      transition: opacity 0.28s ease, visibility 0.28s ease;
      z-index: 20;
      text-align: center;
    }

    .status-overlay.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.16);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }

    .status-overlay.is-error .spinner {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .status-title {
      font-size: 0.98rem;
      font-weight: 600;
      margin: 0;
    }

    .status-detail {
      font-size: 0.84rem;
      color: var(--ui-muted);
      max-width: 440px;
      line-height: 1.5;
      margin: 0;
    }

    .progress-track {
      width: min(260px, 75vw);
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }

    .status-overlay.is-error .progress-track {
      display: none;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #7cc4ff);
      border-radius: 999px;
      transition: width 0.12s ease-out;
    }

    .progress-fill.is-indeterminate {
      width: 40%;
      animation: indeterminate 1.2s ease-in-out infinite;
    }

    @keyframes indeterminate {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(280%); }
    }

    /* 하단 컨트롤 바 */
    .toolbar {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: calc(100% - 24px);
      padding: 8px 12px;
      border-radius: 14px;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      z-index: 15;
    }

    .btn {
      appearance: none;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.08);
      color: var(--ui-text);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 7px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn.is-active {
      background: rgba(79, 140, 255, 0.24);
      border-color: rgba(79, 140, 255, 0.65);
      color: #dbe8ff;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .color-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.82rem;
      cursor: pointer;
    }

    .color-control input[type="color"] {
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
    }

    .fov-control {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      color: var(--ui-text);
    }

    .fov-control input[type="range"] {
      width: 72px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .fov-value {
      min-width: 32px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--ui-muted);
    }

    .hint-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
      font-size: 0.76rem;
      color: var(--ui-muted);
      z-index: 15;
      pointer-events: none;
    }

    .is-hidden-el {
      display: none !important;
    }

    /* 1인칭 관전자 모드 중앙 조준점 */
    .spectator-crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 14;
    }

    .viewer-stage.is-spectator .spectator-crosshair {
      opacity: 1;
    }

    /* 다중 모델 목록(플레이리스트) 사이드 패널 */
    .playlist-toggle {
      position: absolute;
      top: 56px;
      left: 16px;
      z-index: 16;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      backdrop-filter: blur(10px);
    }

    .playlist-panel {
      position: absolute;
      top: 100px;
      left: 16px;
      bottom: 88px;
      width: min(280px, calc(100vw - 32px));
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      border: 1px solid var(--ui-border);
      background: var(--ui-bg);
      backdrop-filter: blur(14px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      z-index: 16;
      overflow: hidden;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .playlist-panel.is-collapsed {
      transform: translateX(calc(-100% - 24px));
      opacity: 0;
      pointer-events: none;
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 12px 12px 10px;
      border-bottom: 1px solid var(--ui-border);
    }

    .playlist-title {
      font-size: 0.86rem;
      font-weight: 600;
      margin: 0;
    }

    .playlist-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-xs {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 7px;
    }

    .playlist-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .playlist-empty {
      margin: auto 8px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--ui-muted);
      line-height: 1.5;
    }

    .playlist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.14s ease, border-color 0.14s ease;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.11);
    }

    .playlist-item.is-active {
      background: rgba(79, 140, 255, 0.22);
      border-color: rgba(79, 140, 255, 0.65);
    }

    .playlist-item-index {
      flex-shrink: 0;
      min-width: 20px;
      font-size: 0.74rem;
      color: var(--ui-muted);
      font-variant-numeric: tabular-nums;
    }

    .playlist-item-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .playlist-item-name {
      font-size: 0.81rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .playlist-item-size {
      font-size: 0.71rem;
      color: var(--ui-muted);
      margin-top: 2px;
    }

    .playlist-item-remove {
      flex-shrink: 0;
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ui-muted);
      font-size: 1rem;
      line-height: 1;
      padding: 2px 5px;
      border-radius: 6px;
      cursor: pointer;
    }

    .playlist-item-remove:hover {
      background: rgba(255, 255, 255, 0.14);
      color: var(--ui-text);
    }

    .playlist-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid var(--ui-border);
    }

    .playlist-counter {
      font-size: 0.78rem;
      color: var(--ui-muted);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main class="viewer-stage" id="viewer-stage">
    <canvas id="viewer-canvas" aria-label="3D 모델 인터랙티브 뷰어"></canvas>
    <div class="spectator-crosshair" aria-hidden="true"></div>

    <div class="hint-badge" id="hint-badge">
      좌클릭: 회전 · 우클릭: 이동(Pan) · 휠/핀치: 줌 · V: 관전자 모드 · [ / ]: 이전/다음 · .glb 여러 개 드래그 가능
    </div>

    <button type="button" class="btn playlist-toggle" id="playlist-toggle-btn" title="모델 목록 열기/닫기 (단축키: L)">
      모델 목록 (0)
    </button>

    <aside class="playlist-panel is-collapsed" id="playlist-panel" aria-label="업로드된 모델 목록">
      <div class="playlist-header">
        <h2 class="playlist-title" id="playlist-title">모델 목록 (0)</h2>
        <div class="playlist-actions">
          <button type="button" class="btn btn-primary btn-xs" id="playlist-add-btn">+ 추가</button>
          <button type="button" class="btn btn-xs" id="playlist-clear-btn">비우기</button>
        </div>
      </div>
      <div class="playlist-items" id="playlist-items">
        <p class="playlist-empty">
          여러 개의 .glb 파일을 선택하거나<br />화면에 드래그하면 하나씩 넘겨볼 수 있습니다.
        </p>
      </div>
      <div class="playlist-footer">
        <button type="button" class="btn btn-xs" id="prev-model-btn" title="이전 모델 ([)">◀ 이전</button>
        <span class="playlist-counter" id="playlist-counter">0 / 0</span>
        <button type="button" class="btn btn-xs" id="next-model-btn" title="다음 모델 (])">다음 ▶</button>
      </div>
    </aside>

    <div class="drop-overlay" aria-hidden="true">
      여기에 .glb 파일을 1개 또는 여러 개 놓으세요
    </div>

    <!-- 로딩 및 에러 상태 오버레이 -->
    <div class="status-overlay" id="status-overlay" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p class="status-title" id="status-title">3D 모델 불러오는 중... 0%</p>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="status-detail" id="status-detail">에셋 데이터를 준비하고 있습니다.</p>
      <button type="button" class="btn btn-primary is-hidden-el" id="overlay-file-btn">
        로컬 .glb 파일 직접 선택
      </button>
    </div>

    <!-- 하단 컨트롤 바 -->
    <div class="toolbar" aria-label="뷰어 제어 도구">
      <button type="button" class="btn btn-primary" id="open-file-btn">.glb 열기 (다중 가능)</button>
      <button type="button" class="btn" id="toolbar-prev-btn" title="이전 모델 ([)">◀</button>
      <button type="button" class="btn" id="toolbar-next-btn" title="다음 모델 (])">▶</button>
      <button type="button" class="btn" id="spectator-btn" title="1인칭 자유 이동 (단축키: V)">관전자 모드 (WASD)</button>
      <button type="button" class="btn" id="reset-camera-btn" title="단축키: R">시점 초기화</button>
      <button type="button" class="btn" id="autorotate-btn">자동 회전</button>
      <button type="button" class="btn is-hidden-el" id="animation-btn">애니메이션 일시정지</button>
      <button type="button" class="btn" id="transparent-btn">투명 배경</button>
      <label class="color-control" title="배경색 변경">
        <span>배경색</span>
        <input type="color" id="bg-color-input" value="#1a1d24" aria-label="배경색 선택" />
      </label>
      <label class="fov-control" title="카메라 시야각(FOV) 조절">
        <span>시야각</span>
        <input type="range" id="fov-slider" min="40" max="100" step="1" value="60" aria-label="카메라 시야각 조절" />
        <span class="fov-value" id="fov-value">60°</span>
      </label>
      <input type="file" id="file-input" accept=".glb,model/gltf-binary" multiple hidden />
    </div>
  </main>

  <!-- file:// 프로토콜로 직접 열었을 때 CORS 차단 안내 -->
  <script>
    if (window.location.protocol === 'file:') {
      const overlay = document.getElementById('status-overlay');
      const title = document.getElementById('status-title');
      const detail = document.getElementById('status-detail');
      overlay.classList.add('is-error');
      title.textContent = '로컬 웹 서버에서 실행해야 합니다 (CORS 제한)';
      detail.innerHTML =
        '보안 정책상 <code>file://</code> 경로에서는 ES Module 및 <code>.glb</code> 로딩이 차단됩니다.<br />' +
        '프로젝트 폴더에서 <code>python -m http.server 8000</code> 또는 VS Code Live Server를 실행한 뒤 ' +
        '<code>http://localhost:8000</code>으로 접속해 주세요.';
    }
  </script>

  <script type="module" src="./viewer.js"></script>
  <script>
    if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
